defaults:
  - _self_
  - dataset: cub.yaml         # can be overridden
  - model: clip.yaml            # can be overridden
  - sae: topk.yaml              # sae model config
#  - sae_comparison: base.yaml
  - train_sae   # training loop params
  - paths

  - experiment: null


  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled



root: ${oc.env:PROJECT_ROOT}
# Override via env vars (or a .env file in the repo root), or on the CLI: outputs=/path data_root=/path
outputs: ${oc.env:OUTPUTS_DIR,${root}/outputs}
data_root: ${oc.env:DATA_ROOT,${root}/data}
device: ${get_device:}
seed: ${oc.env:SEED, 42}
debug : ${oc.env:DEBUG, false}
embedding_dataloader_for_eval: "test" # can be "val" or "test"

# pipeline stages run by src/main.py; disable on the CLI, e.g. stages.visualize=false
stages:
  embed: true
  train: true
  baseline_metrics: true  # CKNNA, FMS, monosemanticity
  matching: true          # F1 / FBMP / nnomp matching
  tapas: true             # TAPAScore on synCUB / synCOCO
  visualize: true

hydra:
  output_subdir: null
  run:
    dir: .
